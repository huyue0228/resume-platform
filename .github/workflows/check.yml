name: Platform verification
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resume_verify
          POSTGRES_PASSWORD: verification-only
          POSTGRES_DB: resume_ci_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resume_verify -d resume_ci_verify"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://resume_verify:verification-only@127.0.0.1:5432/resume_ci_verify?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check-backend check-release
      - run: bash skills/smart-resume-offline-deploy/tests/test_deploy_secrets.sh
      - run: bash skills/smart-resume-offline-deploy/tests/test_validate_w3_env.sh
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - run: make check-frontend
