name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Version already released; use a new tag"; exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi
  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: postgres
            context: docker/postgres
            dockerfile: docker/postgres/Dockerfile
          - component: redis
            context: docker/redis
            dockerfile: docker/redis/Dockerfile
          - component: backup
            context: .
            dockerfile: docker/backup/Dockerfile
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p release
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("release/" + os.environ["COMPONENT"] + ".json").write_text(json.dumps({
              "component": os.environ["COMPONENT"],
              "version": os.environ["VERSION"],
              "image": os.environ["IMAGE"] + ":" + os.environ["VERSION"],
              "digest": os.environ["IMAGE_DIGEST"],
              "published": os.environ["GITHUB_REF"].startswith("refs/tags/"),
              "platform": "linux/amd64",
              "commit": os.environ["GITHUB_SHA"],
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: release/*.json
          retention-days: 7
  release:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: release/images
          merge-multiple: true
      - name: Package image-only deployment template
        run: |
          cp skills/smart-resume-offline-release/assets/docker-compose.yml release/compose.yml
          cp skills/smart-resume-offline-release/assets/env.example release/env.example
          cp REPOSITORIES.md release/REPOSITORIES.md
          cp ops/delivery/README.md release/README.md
          cp backend/resume_contracts/bundle/manifest.json release/contract-manifest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          images = [json.loads(p.read_text()) for p in sorted(Path("release/images").glob("*.json"))]
          assert len(images) == 5
          template = Path("release/env.example")
          template.write_text(template.read_text().replace("__APP_VERSION__", os.environ["VERSION"])
                              .replace("__AGENT_KERNEL_VERSION__", "").replace("__AGENT_KERNEL_IMAGE__", ""))
          settings = ["APP_VERSION=" + os.environ["VERSION"]]
          for item in images:
              value = item["image"].split(":")[0] + "@" + item["digest"] if item["published"] else item["image"]
              key = item["component"].upper() + "_IMAGE"
              if item["component"] in ("postgres", "redis"):
                  key += "_RELEASE"
              settings.append(key + "=" + value)
          settings.extend(["# Set separately after Kernel/model/OCR acceptance:",
                           "AGENT_KERNEL_IMAGE=", "AGENT_KERNEL_VERSION="])
          Path("release/images.env").write_text("\n".join(settings) + "\n")
          PY
          cd release
          sha256sum compose.yml env.example images.env README.md REPOSITORIES.md contract-manifest.json images/*.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -czf "../resume-platform-$VERSION.tar.gz" .
          cd ..
          sha256sum "resume-platform-$VERSION.tar.gz" > "resume-platform-$VERSION.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-deployment-${{ env.VERSION }}
          path: resume-platform-*.tar.gz*
          retention-days: 7
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" resume-platform-*.tar.gz* --verify-tag --generate-notes "${args[@]}"
