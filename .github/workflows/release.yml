name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Version already released; use a new tag"; exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi
  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
          - component: postgres
          - component: redis
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build component using repository tooling
        run: |
          push=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then push="--push"; fi
          make image APP_VERSION="$VERSION" COMPONENT="$COMPONENT" IMAGE_PREFIX="$IMAGE_PREFIX" PUSH="$push"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: release/${{ env.VERSION }}/images/*.json
          retention-days: 7
  release:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: release/images
          merge-multiple: true
      - name: Package image-only deployment template
        run: make package APP_VERSION="$VERSION" IMAGES_DIR=release/images
      - uses: actions/upload-artifact@v4
        with:
          name: platform-deployment-${{ env.VERSION }}
          path: dist/resume-platform-*.tar.gz*
          retention-days: 7
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" dist/resume-platform-*.tar.gz* --verify-tag --generate-notes "${args[@]}"
