# 企业模型路由器使用私有 CA 时叠加到主 Compose；CA 文件由部署现场提供。
services:
  app:
    environment:
      SSL_CERT_FILE: /etc/resume-platform/model-ca.pem
    volumes:
      - type: bind
        source: ${AGENT_KERNEL_CA_BUNDLE:?Set AGENT_KERNEL_CA_BUNDLE to the host CA PEM file}
        target: /etc/resume-platform/model-ca.pem
        read_only: true
        bind:
          create_host_path: false
  agent-kernel:
    environment:
      SSL_CERT_FILE: /etc/agent-kernel/model-ca.pem
    volumes:
      - type: bind
        source: ${AGENT_KERNEL_CA_BUNDLE:?Set AGENT_KERNEL_CA_BUNDLE to the host CA PEM file}
        target: /etc/agent-kernel/model-ca.pem
        read_only: true
        bind:
          create_host_path: false
