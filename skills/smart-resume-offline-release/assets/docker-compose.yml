name: ${COMPOSE_PROJECT_NAME:-smart-resume-filter}

x-backend-env: &backend-env
  PLATFORM_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  USAGE_METRICS_TOKEN: ${USAGE_METRICS_TOKEN:?Set USAGE_METRICS_TOKEN in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
  W3_OAUTH2_ENABLED: ${W3_OAUTH2_ENABLED:-False}
  W3_OAUTH2_CLIENT_ID: ${W3_OAUTH2_CLIENT_ID:-}
  W3_OAUTH2_CLIENT_SECRET: ${W3_OAUTH2_CLIENT_SECRET:-}
  W3_OAUTH2_AUTHORIZE_URL: ${W3_OAUTH2_AUTHORIZE_URL:-}
  W3_OAUTH2_TOKEN_URL: ${W3_OAUTH2_TOKEN_URL:-}
  W3_OAUTH2_USERINFO_URL: ${W3_OAUTH2_USERINFO_URL:-}
  W3_OAUTH2_REDIRECT_URI: ${W3_OAUTH2_REDIRECT_URI:-}
  W3_OAUTH2_FRONTEND_CALLBACK_URL: ${W3_OAUTH2_FRONTEND_CALLBACK_URL:-/login}
  W3_OAUTH2_SCOPE: ${W3_OAUTH2_SCOPE:-}
  W3_OAUTH2_EMPLOYEE_NO_FIELD: ${W3_OAUTH2_EMPLOYEE_NO_FIELD:-employeeNumber}
  W3_OAUTH2_EMAIL_FIELD: ${W3_OAUTH2_EMAIL_FIELD:-email}
  W3_OAUTH2_CLIENT_AUTH_METHOD: ${W3_OAUTH2_CLIENT_AUTH_METHOD:-client_secret_basic}
  W3_OAUTH2_USE_PKCE: ${W3_OAUTH2_USE_PKCE:-True}
  W3_OAUTH2_TIMEOUT_SECONDS: ${W3_OAUTH2_TIMEOUT_SECONDS:-10}
  W3_OAUTH2_TRANSACTION_TTL_SECONDS: ${W3_OAUTH2_TRANSACTION_TTL_SECONDS:-300}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  FILE_UPLOAD_TEMP_DIR: ${FILE_UPLOAD_TEMP_DIR:-/app/media/tmp_uploads}
  AGENT_KERNEL_URL: http://agent-kernel:8090
  AGENT_KERNEL_TOKEN: ${AGENT_KERNEL_TOKEN:?Set AGENT_KERNEL_TOKEN in .env}
  AGENT_KERNEL_BUILD: ${AGENT_KERNEL_VERSION:?Set AGENT_KERNEL_VERSION}
  AGENT_KERNEL_ROLLOUT: ${AGENT_KERNEL_ROLLOUT:-review_only}
  AGENT_KERNEL_MODEL_INSECURE_SKIP_VERIFY: ${AGENT_KERNEL_MODEL_INSECURE_SKIP_VERIFY:-False}

services:
  agent-kernel:
    container_name: ${COMPOSE_PROJECT_NAME:-smart-resume-filter}-agent-kernel
    image: ${AGENT_KERNEL_IMAGE:?Set AGENT_KERNEL_IMAGE}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      AGENT_KERNEL_ADDRESS: :8090
      AGENT_KERNEL_TOKEN: ${AGENT_KERNEL_TOKEN:?Set AGENT_KERNEL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db:
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME:-smart-resume-filter}-postgres
    image: ${POSTGRES_IMAGE_RELEASE:-smart-resume-filter-postgres:${POSTGRES_VERSION:-16}}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    restart: unless-stopped
    container_name: ${COMPOSE_PROJECT_NAME:-smart-resume-filter}-redis
    image: ${REDIS_IMAGE_RELEASE:-smart-resume-filter-redis:${REDIS_VERSION:-7}}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    container_name: ${COMPOSE_PROJECT_NAME:-smart-resume-filter}-app
    image: ${APP_IMAGE:-smart-resume-filter-app:${APP_VERSION:-latest}}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_SEED_BASE: ${RUN_SEED_BASE:-0}
    # Go 程序提供 React 页面、业务 API 与后台任务。
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    command: serve
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    volumes:
      - media_data:/app/media
    depends_on:
      agent-kernel:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "resume-platform", "healthcheck"]
      interval: 30s
      timeout: 12s
      start_period: 60s
      retries: 3

  init:
    profiles: ["init"]
    image: ${APP_IMAGE:-smart-resume-filter-app:${APP_VERSION:-latest}}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      RUN_SEED_BASE: "1"
    command: init
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
